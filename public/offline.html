<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14234b">
<title>SkillSprint · Offline</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f5f0;color:#211d2b}
*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px}
main{width:min(100%,440px);padding:32px;border:1px solid #e8e2f0;border-radius:26px;background:#fff;box-shadow:0 20px 60px #211d2b12;text-align:center}
.mark{width:54px;height:54px;display:grid;place-items:center;margin:0 auto 20px;border-radius:17px;background:#eeeaff;color:#654bd1;font-size:26px;font-weight:900}
h1{margin:0 0 10px;font-size:26px;letter-spacing:-.04em}p{margin:0;color:#716d7b;font-size:14px;line-height:1.7}
a{display:inline-flex;align-items:center;justify-content:center;margin-top:22px;min-height:46px;padding:0 20px;border-radius:13px;background:#6651d8;color:white;font-size:13px;font-weight:700;text-decoration:none}
small{display:block;margin-top:16px;color:#9993a2;font-size:11px}
</style>
</head>
<body><main><div class="mark" aria-hidden="true">S</div><h1>You’re offline</h1><p>SkillSprint is saved on this device. Reopen the app when your connection returns to sync your learning progress.</p><a href="./">Try again</a><small>Your saved lessons remain available when you return to the app.</small></main></body>
</html>
